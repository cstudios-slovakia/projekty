version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: cstudios-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: lead_tracker
      MARIADB_USER: user
      MARIADB_PASSWORD: pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cstudios-web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: cstudios-frontend
    restart: always
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  db_data:
